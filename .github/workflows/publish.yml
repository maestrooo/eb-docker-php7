
      - name: Fix Debian Bullseye repositories
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Dockerfile")
          content = path.read_text()

          old = "RUN apt-get update && apt-get install -y"
          new = (
              "RUN sed -i "
              "'s|http://deb.debian.org/debian-security|"
              "http://archive.debian.org/debian-security|g' "
              "/etc/apt/sources.list "
              "&& apt-get -o Acquire::Check-Valid-Until=false update "
              "&& apt-get install -y"
          )

          if old not in content:
              raise SystemExit("Dockerfile format unexpected")

          path.write_text(content.replace(old, new, 1))
          PY
