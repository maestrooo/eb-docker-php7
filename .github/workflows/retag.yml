
name: Retag Docker Image

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Existing Docker Hub tag"
        required: true
        default: "2.2.0"
      new_tag:
        description: "New Docker Hub tag"
        required: true

jobs:
  retag:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull existing image
        run: |
          docker pull "maestrooo/eb-docker-php7:${{ inputs.source_tag }}"

      - name: Create new tag
        run: |
          docker tag \
            "maestrooo/eb-docker-php7:${{ inputs.source_tag }}" \
            "maestrooo/eb-docker-php7:${{ inputs.new_tag }}"

      - name: Push new tag
        run: |
          docker push "maestrooo/eb-docker-php7:${{ inputs.new_tag }}"
